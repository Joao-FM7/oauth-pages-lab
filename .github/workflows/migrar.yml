
name: migrar

on:
  push:
    branches: [main]
    paths:
      - 'migrations/**'

jobs:
  aplicar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Aplica migracoes no D1 remoto
        run: npx --yes wrangler d1 migrations apply oauth-sessions-unishift --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
